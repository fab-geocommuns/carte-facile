<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carte Facile - Test Local</title>
    
    <!-- MapLibre GL JS -->
    <script src="https://unpkg.com/maplibre-gl@5.0.0/dist/maplibre-gl.js"></script>
    <link href="https://unpkg.com/maplibre-gl@5.0.0/dist/maplibre-gl.css" rel="stylesheet" />
    
    <!-- Carte Facile (version locale) -->
    <link href="../../dist/carte-facile.css" rel="stylesheet" />
    <script src="../../dist/carte-facile.js"></script>
    
    <style>
        body { margin: 0; padding: 0; }
        #map { position: absolute; top: 0; bottom: 0; width: 100%; }
    </style>
</head>
<body>
    <div id="map"></div>
    
    <script>
              // Création la carte
      let map = new maplibregl.Map({
        container: "map", // id du conteneur de la carte
        style: CarteFacile.mapStyles.simple, // Style de carte
        //minZoom: 1.8, // niveau de zoom minimum (optionnel)
        maxZoom: 18.9, // niveau de zoom maximum, adapté aux cartes utilisant les données IGN
      });

      //CarteFacile.setTheme(map, 'dsfr');
      map.addControl(new CarteFacile.ZoomLevelControl);      
      map.addControl(new maplibregl.NavigationControl);
      //map.addControl(new maplibregl.GlobeControl);
      //map.addControl(new maplibregl.TerrainControl);
      map.addControl(new CarteFacile.MapSelectorControl);
      /* map.addControl(new CarteFacile.MapSelectorControl({
        styles: ['simple', 'aerial'],
        overlays: ['administrativeBoundaries', 'cadastre']
      }), 'bottom-left'); */

      /* map.addControl(new CarteFacile.SearchControl()); */

      map.addControl(new CarteFacile.SearchControl({
        onSelect: (result) => {
          const properties = result.data.properties;   // Données transmises par l'API
          console.log(properties);   // Afficher les données dans la console
          console.log(properties.citycode);  // Afficher dans la console le code INSEE
        },
      }));
      map.addControl(new maplibregl.GeolocateControl(), 'top-left');

      map.addControl(new CarteFacile.LayersControl);

      map.addControl(new CarteFacile.AudioReaderControl(), 'top-left');

      map.on('load', () => {
        map.addSource('epr', {
          type: 'geojson',
          data: 'https://raw.githubusercontent.com/simon-dejaeghere/PAUDA/main/etablissements-labellises-tourisme-et-handicap.geojson'
        });

        map.addLayer({
          id: 'epr',
          type: 'symbol',
          metadata: { 'cartefacile:group': 'data' },
          source: 'epr',
          minzoom: 12,
          layout: {
          "visibility": "visible",
          "symbol-placement": "point",
          "text-field": "{nom_du_professionnel}",
          "text-size": 14,
          "text-allow-overlap": false,
          "text-offset": [0.3, -0.25],
          "text-padding": 3,
          "text-anchor": "bottom-left",
          "text-font": [
            "Source Sans Pro Bold"
          ],
          "icon-image": "Abri",
          "icon-size": {
            "stops": [[15, 0.33], [17, 1]]
          },
          "icon-anchor": "left"
        },
        "paint": {
          "text-color": "rgba(35, 110, 34, 1)",
          "text-halo-width": 1,
          "text-halo-blur": 1,
          "text-halo-color": "rgba(255, 255, 255, 1)"
  
        }
        });
      });

      //CarteFacile.addOverlay(map, [CarteFacile.Overlay.cadastre, CarteFacile.Overlay.administrativeBoundaries]);

      //CarteFacile.hideLayer(map, CarteFacile.LayerGroup.street_labels);

      //map.setStyle(CarteFacile.mapStyles.aerial);

      /* setTimeout(() => {
        CarteFacile.removeOverlay(map, CarteFacile.Overlay.administrativeBoundaries);
        CarteFacile.showLayer(map, CarteFacile.LayerGroup.streets);
      }, 5000); */
    </script>
</body>
</html>

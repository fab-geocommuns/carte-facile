name: Tests

on:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.61.0-noble
      options: --user 1001
    strategy:
      matrix:
        node-version: [24.x, 26.x]
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm, Node.js and dependencies
        uses: pnpm/setup@v3
        with:
          runtime: node@${{ matrix.node-version }}
          cache: true

      - name: Build lib
        run: pnpm run build

      - name: Run tests
        run: pnpm test